<title>楼宇宙 · TF养成模拟器</title><style>
:root{color-scheme:dark;--bg:#10151f;--panel:#1a2230;--line:#354255;--text:#f1f3f9;--sub:#aebace;--accent:#bde7f1;--gold:#efd5a2;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;color:var(--text);background:radial-gradient(ellipse at 45% 0,#263143 0,transparent 44%),var(--bg)}.wrap{width:min(1240px,calc(100% - 48px));margin:auto}.mast,footer{min-height:66px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;color:var(--sub)}.brand{font-weight:750;color:var(--text);letter-spacing:.11em}.brand i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 15px var(--accent);margin-right:5px}.brand small{margin-left:8px;color:var(--sub);font:10px ui-monospace,monospace}.badge{border:1px solid var(--line);padding:5px 8px;border-radius:20px}button,select{font:inherit;color:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}button:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:3px}.quiet,.primary{min-height:42px;padding:9px 14px;border:1px solid var(--line);background:#1d2939;border-radius:7px}.primary{background:var(--accent);border-color:var(--accent);color:#152634;font-weight:750}.primary:hover:not(:disabled){background:#e1f5ff}.quiet:hover{background:#304057}.eyebrow{color:var(--accent);font:11px/1.5 ui-monospace,monospace;letter-spacing:.15em;margin:0 0 10px}.sub{color:var(--sub);font-size:13px;line-height:1.65}.tiny{font-size:11px}
.cover,.scene{position:relative;isolation:isolate;overflow:hidden;border:1px solid var(--line);background:#263143}.cover{min-height:620px;display:flex;align-items:center;border-radius:18px}.cover img,.scene img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}.cover img{object-position:center 48%}.cover::after,.scene::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,#121a29f5,#121a29cf 39%,#10172130 78%),linear-gradient(0deg,#10172170,transparent 60%)}.cover-copy{padding:45px 6%;max-width:630px}.cover h1{font-size:clamp(65px,11vw,142px);letter-spacing:-.09em;line-height:.95;margin:22px 0 21px}.cover h1 span{display:block;font-size:clamp(23px,4vw,48px);letter-spacing:.05em;margin-top:15px;color:#d9eaf6}.lead{font-size:17px;line-height:1.55;color:#e0e8f3;margin-bottom:26px}form{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:13px}form label{color:var(--sub);display:block;width:100%}select{min-height:42px;background:#202b3b;border:1px solid #526378;border-radius:7px;padding:7px 10px}.cover-meta{color:var(--sub);margin-top:24px;font:12px ui-monospace,monospace}.cover-meta b{color:var(--gold)}#resume{margin-top:10px}
.scene{min-height:270px;display:flex;align-items:end;border-radius:13px}.scene-copy{padding:25px 32px;max-width:650px}.scene h1{font-size:clamp(32px,6vw,62px);margin:0 0 8px;line-height:1.08}.scene h1:focus{outline:none}#scene-desc{margin:0;color:#e2ebf6;font-size:14px;line-height:1.7}.timeline{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin:13px 0}.timeline span{background:#1b2532;border:1px solid var(--line);border-radius:4px;text-align:center;font:11px/2.5 ui-monospace,monospace;color:var(--sub)}.timeline span.assessment{border-bottom-color:var(--gold)}.timeline span.past{background:#2b4857;color:var(--accent)}.timeline span.current{background:var(--accent);color:#172332;font-weight:800}
.game-grid{display:grid;grid-template-columns:minmax(190px,235px) minmax(0,1fr) minmax(180px,225px);gap:12px;align-items:start}.panel{border:1px solid var(--line);background:var(--panel);padding:15px;border-radius:11px}.panel+.panel{margin-top:12px}.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-bottom:10px}.panel-head h2{font-size:14px;margin:0}.panel-head span{color:var(--sub);font-size:10px}.workspace{padding:clamp(16px,3vw,29px);min-height:420px;scroll-margin-top:10px}.workspace h2{margin:0;font-size:clamp(21px,3vw,33px)}.workspace>.primary{margin-top:12px}.member{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:6px;width:100%;margin:4px 0;text-align:left;background:#202b3b;border:1px solid transparent;border-radius:6px;padding:5px;color:var(--text);font-size:12px}.selected{border-color:var(--accent)!important;background:#314858!important}.member small{color:var(--sub);font-size:10px}.avatar{display:grid;place-items:center;width:28px;height:28px;background:#36475c;border-radius:50%;color:var(--accent)}.rank-row{margin:9px 0}.rank-label,.pair-row{display:flex;justify-content:space-between;gap:5px;font-size:12px}.rank-label b,.pair-row b{color:var(--accent);font:11px ui-monospace,monospace}.rank-bar{height:3px;background:#354255;margin-top:5px}.rank-bar i{display:block;height:100%;background:var(--accent)}#profile h3{font-size:11px;color:var(--accent);margin:11px 0 4px}dl{display:grid;grid-template-columns:1fr auto;gap:4px;font-size:12px;margin:0}dt{color:var(--sub)}dd{margin:0}.pair-row{padding:6px 0;border-bottom:1px solid var(--line)}.sentiment{font-size:11px;color:var(--gold);margin-bottom:0}.action-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin:14px 0}.action{display:grid;gap:6px;align-content:center;text-align:left;background:#222e40;border:1px solid #46576d;border-radius:7px;min-height:62px;padding:9px 11px}.action:hover:not(:disabled){border-color:var(--accent)}.action small{color:var(--sub);font-size:11px;line-height:1.45}.field{display:flex;align-items:center;gap:8px;font-size:13px;margin:8px 0;color:var(--sub)}.field select{color:var(--text)}.notice{padding:8px 10px;border-left:2px solid var(--accent);background:#243446;font-size:13px}.log{padding-left:19px;color:var(--sub);font-size:13px;line-height:1.65}.log li+li{margin-top:5px}.ending-card{border-top:1px solid var(--line);padding-top:12px;margin-top:14px}.ending-card h3{margin:0}.budget{margin-bottom:0}
@media(max-width:970px){.game-grid{grid-template-columns:175px minmax(0,1fr)}.game-grid>aside:last-child{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:12px}.game-grid>aside:last-child .panel{margin:0}}
@media(max-width:760px){.wrap{width:calc(100% - 22px)}.cover{min-height:580px}.cover::after{background:linear-gradient(90deg,#101721de,#10172172)}.cover-copy{padding-inline:5%}.brand small,.badge{display:none}.scene{min-height:220px}.scene-copy{padding:17px}.game-grid{grid-template-columns:minmax(0,1fr)}.game-grid>aside:first-child{display:contents}.game-grid>aside:first-child>section:first-child{grid-row:1}.workspace{grid-row:2}.ranking{grid-row:3;margin:0!important}#roster{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:3px}.member{grid-template-columns:22px 1fr;gap:4px}.avatar{width:21px;height:21px}.member small{grid-column:2}.game-grid>aside:last-child{grid-row:4}.mast,footer{font-size:10px}}
</style>

const MONTHS = 12;
const RESOURCES = ["家族晚会","夏日运动会","单曲录制"];
const clamp = (n,min=0,max=100) => Math.max(min,Math.min(max,n));
const pairKey = (a,b) => [a,b].sort((x,y)=>x-y).join("-");
const skill = p => .30*p.vocal+.30*p.dance+.15*p.rap+.25*p.stage;

function createGame(size, seed) {
  const members = DATA.roster.slice(0,size).map((p,id)=>({...p,id}));
  const pairs = {};
  for(const a of members) for(const b of members) if(a.id<b.id) {
    pairs[pairKey(a.id,b.id)] = {affinity:Math.floor((a.bond+b.bond)/2),heat:0};
  }
  const g = {size,seed,rng:seed,month:1,energy:8+size*2,maxEnergy:8+size*2,members,pairs,
    plan:{},rested:[],log:[],phase:"plan",deck:DATA.events.map((_,i)=>i).filter(i=>!RESOURCES.includes(DATA.events[i].title)),
    event:null,outside:null,scores:members.map(p=>Math.round(skill(p)*10)/10),movement:{},reports:[],resourceDates:{}};
  const dates=[];
  while(dates.length<3){
    const date=2+Math.floor(rand(g)*11);
    if(!dates.includes(date)) dates.push(date);
  }
  dates.sort((a,b)=>a-b).forEach((date,i)=>{g.resourceDates[date]=DATA.events.findIndex(e=>e.title===RESOURCES[i]);});
  return g;
}

// Keep the random state in the save so refreshing never rerolls a draw.
function rand(g) {
  g.rng=(Math.imul(1664525,g.rng)+1013904223)>>>0;
  return g.rng/4294967296;
}

function change(p,effects) {
  const updates=[];
  for(const [key,delta] of Object.entries(effects)){
    const before=p[key];
    p[key]=clamp(before+delta,0,DATA.attributes[key][1]??Infinity);
    if(before!==p[key]) updates.push(DATA.attributes[key][0]+" "+(p[key]>before?"+":"")+(p[key]-before));
  }
  if(p.fatigue>=90&&!p.sick){
    p.sick=true;
    p.mind=clamp(p.mind-12);
    updates.push("疲惫过高，次月强制病休");
  }
  return updates;
}

function apply(g,p,option,partner,resourceAction=false) {
  g.energy-=option.cost;
  const effects={...option.effects};
  if(resourceAction) effects.fans+=p.favor*6+Math.floor(p.cp*p.bond/18);
  const update=(member,delta)=> {
    const result=change(member,delta);
    if(result.length) g.log.push(member.name+"｜"+result.join(" · "));
  };
  update(p,effects);
  if(partner){
    const pair=g.pairs[pairKey(p.id,partner.id)];
    pair.affinity=clamp(pair.affinity+option.affinity);
    if(option.cp_heat) pair.heat=clamp(pair.heat+option.cp_heat+
      (option.cp_heat>0?Math.floor((p.cp+partner.cp)/20):0));
    const shared=Object.fromEntries(Object.entries(effects).filter(([key,v])=>
      ["stage","vocal","rap","fatigue","fans","heat","bond"].includes(key)&&v>0
    ).map(([key,v])=>[key,Math.floor(v/2)]));
    update(partner,shared);
    g.log.push(p.name+" × "+partner.name+"｜默契 "+pair.affinity+" · CP 热度 "+pair.heat);
  }
}

function rosterRank(g) {
  return [...g.members].sort((a,b)=>g.scores[b.id]-g.scores[a.id]);
}

function candidates(g,except=-1){
  return g.members.filter(p=>p.id!==except&&!p.sick&&!g.rested.includes(p.id));
}

function resolvePlan(g) {
  if(g.phase!=="plan"||!g.members.every(p=>p.sick||g.rested.includes(p.id)||g.plan[p.id])) return;
  const total=Object.values(g.plan).reduce((sum,p)=>sum+DATA.actions[p.action].cost,0);
  if(total>g.energy) return;
  g.log=[];
  for(const p of g.members){
    if(g.rested.includes(p.id)){
      p.sick=false;
      g.log.push(p.name+"｜强制病休 · "+change(p,{fatigue:-50,mind:20,resilience:3}).join(" · "));
      continue;
    }
    if(p.sick){g.log.push(p.name+"｜已暂停剩余行程");continue;}
    const planned=g.plan[p.id], option=DATA.actions[planned.action];
    const partner=candidates(g,p.id).find(person=>person.id===planned.partner);
    if((option.affinity||option.cp_heat)&&!partner){
      g.log.push(p.name+"｜搭档缺席，改为恢复训练");
      apply(g,p,DATA.actions[2]);
    }else apply(g,p,option,partner,planned.action===3);
  }
  let event=g.resourceDates[g.month];
  if(event===undefined&&g.deck.length&&rand(g)<.76){
    event=g.deck.splice(Math.floor(rand(g)*g.deck.length),1)[0];
  }
  g.event=event??null;
  if(g.event===0) g.outside={id:5,name:"岑星简",vocal:66,dance:68,rap:47,stage:63,mind:76,resilience:50,fatigue:18};
  g.phase=g.event===null?"report":"event";
  if(g.phase==="report") settle(g);
}

function resolveEvent(g, optionIndex, target, companion) {
  if(g.phase!=="event") return;
  const event=DATA.events[g.event], option=event.options[optionIndex];
  const available=candidates(g), person=available.find(p=>p.id===target);
  const partner=available.find(p=>p.id===companion&&p.id!==target);
  if(available.length&&(!person||!option||option.cost>g.energy)) return;
  if(person){
    g.log.push("事件｜"+option.label);
    apply(g,person,option,partner);
    if(event.title==="家族晚会"&&optionIndex===1) for(const member of available){
      if(member!==person&&member!==partner) g.log.push(member.name+"｜"+change(member,option.effects).join(" · "));
    }
  }else g.log.push("全组正在休养，活动延期。");
  g.phase="report";
  settle(g);
}

function settle(g) {
  for(const [key,pair] of Object.entries(g.pairs)){
    if(pair.heat>=20) for(const id of key.split("-").map(Number)){
      const p=g.members[id], effects={heat:Math.floor(pair.heat/10),fans:pair.heat*2};
      if(pair.heat>=35&&rand(g)<pair.heat/110) effects.scandals=1+Math.floor(pair.heat/40);
      const updates=change(p,effects);
      if(updates.length) g.log.push("CP 舆情 · "+p.name+"｜"+updates.join(" · "));
    }
    pair.heat=Math.max(0,pair.heat-8);
  }
  for(const p of g.members){
    const relations=Object.entries(g.pairs).filter(([key])=>key.split("-").map(Number).includes(p.id)).map(([,pair])=>pair.affinity);
    const effects={heat:-3};
    if(relations.length) effects.bond=Math.round((relations.reduce((a,b)=>a+b,0)/relations.length-50)/12);
    if(p.scandals>=6) effects.public=-Math.min(18,(p.scandals-4)*2);
    if(p.fatigue>=80) Object.assign(effects,{mind:-16,stage:-3});
    else if(p.fatigue>=65) effects.mind=-7;
    if(p.mind<=20) effects.stage=(effects.stage??0)-5;
    const updates=change(p,effects);
    if(updates.length) g.log.push("月末 · "+p.name+"｜"+updates.join(" · "));
  }
  g.reports=[];
  if(g.month%3!==0) return;
  const previous=rosterRank(g).map(p=>p.id);
  for(const p of [...g.members,...(g.outside?[g.outside]:[])]){
    if(p===g.outside) for(const key of ["vocal","dance","rap","stage"]) p[key]=clamp(p[key]+(key==="dance"?2:1));
    const roll=rand(g);
    const mishap=roll<Math.max(.07,.15+p.fatigue/400-p.resilience/500);
    const burst=roll>1-(.14+p.mind/800);
    const modifier=mishap?-(8+Math.floor(rand(g)*8)):burst?7+Math.floor(rand(g)*7):0;
    const deduction=Math.max(0,p.fatigue-42)*.28+Math.max(0,45-p.mind)*.28+(p.sick?8:0);
    const score=Math.round(clamp(skill(p)-deduction+modifier)*10)/10;
    g.scores[p.id]=score;
    g.reports.push({id:p.id,name:p.name,score,label:mishap?"舞台翻车":burst?"超常发挥":"正常发挥",modifier,deduction});
  }
  g.movement=Object.fromEntries(rosterRank(g).map((p,i)=>[p.id,previous.indexOf(p.id)-i]));
}

function advance(g) {
  if(g.phase!=="report") return;
  if(g.month===MONTHS){g.phase="ending";return;}
  g.month++;
  g.energy=Math.min(g.maxEnergy,g.energy+2+g.size);
  g.plan={};g.rested=g.members.filter(p=>p.sick).map(p=>p.id);
  g.event=null;g.phase="plan";
}

const crisis = p => p.scandals>=16&&p.public<=32;
function endings(g) {
  const average = get => g.members.reduce((sum,p)=>sum+get(p),0)/g.size;
  const group=g.size>=2&&average(p=>g.scores[p.id])>=59&&average(p=>p.bond)>=75&&
    average(p=>p.fans)>=3000&&g.members.every(p=>p.public>=55&&p.scandals<=4);
  const ranked=[...g.members,...(g.outside?[g.outside]:[])].filter(p=>!crisis(p)).sort((a,b)=>g.scores[b.id]-g.scores[a.id]);
  return rosterRank(g).map(p=>{
    const rank=ranked.indexOf(p)+1;
    if(crisis(p)) return [p,4,"舆论翻车 · 终止训练","活动方暂停合作。最后一次会议，你们一起整理了时间线，决定先把生活安顿好。"];
    if(group) return [p,5,"全员成团 · 团体爆红","公司追加全员企划。首演那晚，观众把整段接力副歌送上热搜。"];
    if(rank===1&&skill(p)>=65&&p.fans>=3700&&p.public>=55) return [p,1,"C 位顶流出道","终考第一名被念到时，他先找到了队友的位置。几周后，主镜头从他起拍，一直跟到最后一个定点。"];
    if(rank<=3||(skill(p)>=62&&p.public>=50&&p.fans>=2200)) return [p,2,"实力稳定 · 稳步发展",rank<=3?"他拿到了出道席位。第一次正式录制结束后，他问你下次什么时候练新歌。":"他拿到了后续舞台的合作机会。你们约好下周把第一首歌练完。"];
    const displaced=g.outside&&rank===4&&ranked.indexOf(g.outside)<3;
    return [p,3,"卡位 · 留在训练营",(displaced?"空降选手拿走了最后一个席位。":"同期选手在终考拉开了差距。")+"散场后，他把新一轮训练表贴回练习室的门上。"];
  });
}

const $=id=>document.getElementById(id);
const SAVE="tf-universe-web-v1";
let game, active=0, eventTarget=null, eventPartner=null;
let saved;
try{
  const value=JSON.parse(localStorage.getItem(SAVE));
  if(value?.version===1&&value.game?.members?.length) saved=value.game;
}catch{ /* Storage may be unavailable in a private browser. */ }

function persist(){
  saved=game;
  try{localStorage.setItem(SAVE,JSON.stringify({version:1,game}));}catch{}
}
function el(tag,text,cls){
  const node=document.createElement(tag);
  if(text!==undefined) node.textContent=text;
  if(cls) node.className=cls;
  return node;
}
function button(label,action,cls="quiet",disabled=false){
  const node=el("button",label,cls);
  node.type="button";node.disabled=disabled;node.addEventListener("click",action);
  return node;
}
function text(id,value){$(id).textContent=value;}
function heading(parent,kicker,title,desc){
  parent.append(el("p",kicker,"eyebrow"),el("h2",title),el("p",desc,"sub"));
}
function preview(option){
  return Object.entries(option.effects).slice(0,4).map(([k,v])=>DATA.attributes[k][0]+" "+(v>0?"+":"")+v).join(" · ");
}
function isPair(option){return Boolean(option.affinity||option.cp_heat);}
function cover(){
  $("cover").hidden=false;$("game").hidden=true;$("home").hidden=true;$("resume").hidden=!saved;
}
function scene(image,kicker,title,desc){
  $("scene-image").src=ART[image];
  text("scene-kicker",kicker);text("scene-title",title);text("scene-desc",desc);
}
function selectMember(label,people,current,choose){
  const wrapper=el("label",label,"field");
  const select=el("select");
  for(const p of people){
    const option=el("option",p.name);
    option.value=p.id;select.append(option);
  }
  select.value=current;
  select.addEventListener("change",()=>choose(Number(select.value)));
  wrapper.append(select);
  return wrapper;
}
function renderSidebar(){
  text("energy","精力 "+game.energy+"/"+game.maxEnergy);
  const roster=$("roster");roster.replaceChildren();
  for(const p of game.members){
    const status=p.sick||game.rested.includes(p.id)?"病休":game.plan[p.id]?"已排期":"待安排";
    const member=button("",()=>{
      active=p.id;
      render();
      if(window.matchMedia("(max-width: 760px)").matches) $("workspace").scrollIntoView({block:"start"});
    },"member"+(p.id===active?" selected":""));
    member.setAttribute("aria-pressed",String(p.id===active));
    member.append(el("span",p.name.slice(-1),"avatar"),el("strong",p.name),el("small",game.phase==="plan"?status:"查看档案"));
    roster.append(member);
  }
  const rank=$("ranking");rank.replaceChildren();
  rosterRank(game).forEach((p,i)=>{
    const row=el("div",undefined,"rank-row"), line=el("div",undefined,"rank-label");
    const move=game.movement[p.id]??0;
    line.append(el("span",String(i+1).padStart(2,"0")+"  "+p.name),el("b",game.scores[p.id].toFixed(1)+(move?"  "+(move>0?"↑":"↓")+Math.abs(move):"")));
    const bar=el("div",undefined,"rank-bar"), fill=el("i");
    fill.style.width=game.scores[p.id]+"%";bar.append(fill);row.append(line,bar);rank.append(row);
  });
  if(game.outside) rank.append(el("p","外部竞位 · "+game.outside.name+" "+(game.scores[5]?.toFixed(1)??"待月考"),"sub tiny"));
  const p=game.members[active], profile=$("profile");
  text("profile-name",p.name);profile.replaceChildren();
  for(const [group,keys] of Object.entries(DATA.groups)){
    profile.append(el("h3",group));
    const list=el("dl");
    for(const key of keys) list.append(el("dt",DATA.attributes[key][0]),el("dd",p[key].toLocaleString("zh-CN")));
    profile.append(list);
  }
  profile.append(el("p",(p.public>=66?"路人好评为主":p.public>=40?"路人评价分化":"路人负评居多")+" · "+
    (p.heat>=75?"热搜前排":p.heat>=45?"话题升温":"关注平稳"),"sentiment"));
  const pairs=$("pairs");pairs.replaceChildren();
  if(!Object.keys(game.pairs).length) pairs.append(el("p","单人路线","sub tiny"));
  for(const [key,pair] of Object.entries(game.pairs)){
    const [a,b]=key.split("-").map(Number);
    if(a!==active&&b!==active) continue;
    const row=el("div",undefined,"pair-row");
    row.append(el("span",game.members[a===active?b:a].name),el("b",pair.affinity+" / "+pair.heat));
    pairs.append(row);
  }
}

function renderPlan(box){
  scene("dorm","DORM / "+String(game.month).padStart(2,"0"),"宿舍大厅","夜训刚结束。你把下个月的可能性，排进了这张行程表。");
  const ready=game.members.filter(p=>game.plan[p.id]||game.rested.includes(p.id)).length;
  heading(box,"01 / 本月排期","给小组排一次行程",ready+" / "+game.size+" 已安排 · 点击成员切换，提交前可以改选。");
  const p=game.members[active];
  if(game.rested.includes(p.id)) box.append(el("p",p.name+" 本月强制病休，结算时恢复体力。","notice"));
  else{
    const actions=el("div",undefined,"action-grid");
    const plan=game.plan[active];
    const partners=candidates(game,active);
    DATA.actions.forEach((option,i)=>{
      const card=button("",()=>{
        game.plan[active]={action:i,partner:isPair(option)?partners[0]?.id:null};
        persist();render();
      },"action"+(plan?.action===i?" selected":""),isPair(option)&&!partners.length);
      card.setAttribute("aria-pressed",String(plan?.action===i));
      card.append(el("strong",option.label),el("small",preview(option)+(option.cost?" · 精力 −"+option.cost:"")));
      actions.append(card);
    });
    box.append(actions);
    if(plan&&isPair(DATA.actions[plan.action])&&partners.length){
      box.append(selectMember("选择搭档",partners,plan.partner,id=>{plan.partner=id;persist();}));
    }
  }
  const cost=Object.values(game.plan).reduce((sum,p)=>sum+DATA.actions[p.action].cost,0);
  box.append(el("p","本月预计消耗经纪人精力 "+cost+" / "+game.energy+(cost>game.energy?" · 请调整公关安排":""),"sub budget"));
  box.append(button("确认排期 →",()=>{
    resolvePlan(game);eventTarget=null;eventPartner=null;persist();render(true);
  },"primary",ready!==game.size||cost>game.energy));
}

function renderEvent(box){
  const e=DATA.events[game.event];
  const image=/天台|内耗/.test(e.title)?"rooftop":/晚会|运动会|录制|外务|见面会/.test(e.title)?"stage":"practice";
  scene(image,RESOURCES.includes(e.title)?"SPECIAL / 资源事件":"EVENT / 剧情事件",e.title,e.story);
  heading(box,"02 / 事件决策","经纪人怎么做？","选择出勤成员，再决定怎么应对。");
  const people=candidates(game);
  if(!people.length){
    box.append(el("p","全组休养，活动延期。","notice"),button("继续结算 →",()=>{resolveEvent(game,0,null,null);persist();render(true);},"primary"));
    return;
  }
  if(!people.some(p=>p.id===eventTarget)) eventTarget=people[0].id;
  const partners=people.filter(p=>p.id!==eventTarget);
  if(!partners.some(p=>p.id===eventPartner)) eventPartner=partners[0]?.id;
  box.append(selectMember("出勤成员",people,eventTarget,id=>{eventTarget=id;render();$("workspace").querySelector("select")?.focus();}));
  if(partners.length&&e.options.some(isPair)) box.append(selectMember("搭档（双人方案）",partners,eventPartner,id=>{eventPartner=id;}));
  const choices=el("div",undefined,"action-grid");
  e.options.forEach((o,i)=>{
    const choice=button("",()=>{
      resolveEvent(game,i,eventTarget,isPair(o)?eventPartner:null);persist();render(true);
    },"action",o.cost>game.energy);
    choice.append(el("strong",o.label),el("small",preview(o)+(o.cost?" · 精力 −"+o.cost:"")));
    choices.append(choice);
  });
  box.append(choices);
}

function renderReport(box){
  const assessed=game.reports.length>0;
  scene(assessed?"stage":"dorm",assessed?"ASSESSMENT / 月考":"RECAP / 月末",
    assessed?"第 "+game.month/3+" 次月考":"第 "+game.month+" 月结算",
    assessed?"灯灭后，评审把最新的番位表放在后台。":"训练、事件和舆情已经结算，可以查看每个人本月的变化。");
  heading(box,"03 / 经纪人手记",assessed?"舞台成绩单":"本月发生了什么","高疲劳会拖累状态，双人热度也可能带来舆情变化。");
  for(const report of [...game.reports].sort((a,b)=>b.score-a.score)){
    box.append(el("p",report.name+" · "+report.score.toFixed(1)+" 分 · "+report.label+
      (report.modifier?" "+(report.modifier>0?"+":"")+report.modifier:"")+
      (report.deduction?" · 状态扣 "+report.deduction.toFixed(1):""),"notice"));
  }
  const log=el("ul",undefined,"log");
  for(const line of game.log) log.append(el("li",line));
  box.append(log,button(game.month===12?"查看出道夜 →":"进入下个月 →",()=>{
    advance(game);active=0;persist();render(true);
  },"primary"));
}
function renderEnding(box){
  const results=endings(game);
  const debut=results.some(([,n,,story])=>n===1||n===5||(n===2&&story.startsWith("他拿到了出道席位")));
  scene(debut?"finale":"practice","FINAL / 出道夜","最后一张名单","十二个月过去了。每个人都有自己的下一站。");
  heading(box,"04 / 最终档案","小组结局","同一局里，成员可以走向不同的结局。");
  for(const [p,number,title,story] of results){
    const card=el("article",undefined,"ending-card");
    card.append(el("p",p.name+" · 结局 "+number+" / 5","eyebrow"),el("h3",title),el("p",story,"sub"));
    box.append(card);
  }
  box.append(button("回封面，再开一局",cover,"primary"));
}
function render(focus=false){
  $("cover").hidden=true;$("game").hidden=false;$("home").hidden=false;
  const timeline=$("timeline");timeline.replaceChildren();
  for(let i=1;i<=MONTHS;i++){
    const node=el("span",String(i).padStart(2,"0"),i===game.month?"current":i<game.month?"past":"");
    if(i===game.month) node.setAttribute("aria-current","step");
    node.title="第 "+i+" 月"+(i%3===0?" · 月考":"");
    if(i%3===0) node.classList.add("assessment");
    timeline.append(node);
  }
  renderSidebar();
  const box=$("workspace");box.replaceChildren();
  ({plan:renderPlan,event:renderEvent,report:renderReport,ending:renderEnding})[game.phase](box);
  if(focus){window.scrollTo(0,0);$("scene-title").focus({preventScroll:true});}
}

$("start").addEventListener("submit",event=>{
  event.preventDefault();
  if(saved&&saved.phase!=="ending"&&!confirm("开始新一局会覆盖当前存档，继续吗？")) return;
  game=createGame(Number($("size").value),crypto.getRandomValues(new Uint32Array(1))[0]);
  active=0;persist();render(true);
});
$("resume").addEventListener("click",()=>{game=saved;active=0;eventTarget=null;eventPartner=null;render(true);});
$("home").addEventListener("click",cover);
cover();

</script></body></html>
